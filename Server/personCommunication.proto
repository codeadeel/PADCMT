syntax = "proto3";

service personService {
    rpc inference(serverInput) returns (serverOutput);
}

message serverInput {
    bytes imgs = 1;
    int32 batch = 2;
    int32 width = 3;
    int32 height = 4;
    int32 channel = 5;
    string dataType = 6;
    string detectionConfidence = 7;
    string nmsThreshold = 8;
    string iouThreshold = 9;
    string boxCushion = 10;
    string trackerFrames = 11;
    string trackerIds = 12;
    string clientId = 13;
}

message serverOutput {
    string results = 1;
}
